{% extends "base.html" %}
{% block title %}{{ t(key="home_title") }}{% endblock title %}
{% block content %}
<h1 class="text-2xl font-semibold">{{ t(key="home_title") }}</h1>
<form class="card mt-6" action="/notes" method="post" hx-post="/notes" hx-target="#notes" hx-swap="innerHTML" data-reset-on-success>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="label" for="body">{{ t(key="home_new_note") }}</label>
  <textarea class="input" id="body" name="body" rows="3" maxlength="2000" required></textarea>
  <button class="btn mt-3" type="submit">{{ t(key="home_add") }}</button>
</form>
<section id="notes" class="mt-6" aria-live="polite">
  {% include "fragments/notes.html" %}
</section>
{% endblock content %}
