<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ csrf_token | default(value="") }}">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
  <title>{% block title %}{% endblock title %} · {{ app_name }}</title>
  <link rel="icon" href="{{ static_url(name="favicon.svg") }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static_url(name="app.css") }}">
  <script src="{{ static_url(name="vendor/htmx/htmx.min.js") }}" defer></script>
  <script src="{{ static_url(name="app.js") }}" defer></script>
</head>
<body class="min-h-dvh bg-surface font-sans text-ink antialiased">
  <a class="skip-link" href="#main">{{ t(key="skip_to_content") }}</a>
  <header class="border-b border-line bg-panel">
    <div class="mx-auto flex max-w-3xl flex-wrap items-center gap-x-4 gap-y-1 px-4 py-3">
      <a class="font-semibold" href="/">{{ app_name }}</a>
      <nav class="ml-auto flex flex-wrap items-center gap-x-3" aria-label="Main">
        {% if user %}
        <a class="btn-quiet" href="/">{{ t(key="nav_home") }}</a>
        <a class="btn-quiet" href="/settings">{{ t(key="nav_settings") }}</a>
        <form action="/logout" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="btn-quiet" type="submit">{{ t(key="nav_logout") }}</button>
        </form>
        {% endif %}
        {% for language in languages %}
        <a class="btn-quiet" href="/locale/{{ language.code }}" lang="{{ language.code }}">{{ language.name }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main id="main" class="mx-auto max-w-3xl px-4 py-8">
    {% if flash %}
    <p class="notice notice-{{ flash.kind }} mb-6" role="status">{{ flash.message }}</p>
    {% endif %}
    {% block content %}{% endblock content %}
  </main>
  <div id="toasts" class="fixed right-4 bottom-4 flex max-w-sm flex-col gap-2" aria-live="polite"></div>
</body>
</html>
