[workspace]
resolver = "3"
members = ["crates/*"]
# The starter is generated into its own project, and only checked from there.
exclude = ["templates"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The toolchain pinned by the apps this was extracted from.
rust-version = "1.98"
authors = ["Piotr Siuszko"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Leinnan/web_mev_toolkit"
publish = false

[workspace.dependencies]
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
dotenvy = "0.15"
http-body-util = "0.1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
subtle = "2.6"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = "1"
tower = "0.5"
tower-cookies = "0.11"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

web_mev_axum = { path = "crates/web_mev_axum" }
web_mev_core = { path = "crates/web_mev_core" }
web_mev_runtime = { path = "crates/web_mev_runtime" }
web_mev_sqlite = { path = "crates/web_mev_sqlite" }
web_mev_test = { path = "crates/web_mev_test" }

# Panics are denied in production code. clippy.toml exempts tests.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Our crates quick to rebuild, dependencies fast at run time.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"
